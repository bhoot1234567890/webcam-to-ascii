<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASCII comparison</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E">
    <style>
      body { padding: 24px; }
      #comparison { width: max-content; padding: 20px; background: #10171d; }
      #source { display: block; max-width: 512px; max-height: 512px; object-fit: contain; margin: 12px 0 24px; }
      #comparison h1 { font-size: 24px; line-height: 32px; }
      .grids { display: flex; align-items: flex-start; gap: 24px; width: max-content; }
      .side { flex: none; width: max-content; }
      .side h2 { margin: 0 0 12px; line-height: 20px; }
      .grid { display: block; width: max-content; margin: 0; padding: 0 0 2px; border: 0; overflow: visible; color: #e2e9e7; background: #0b1116; }
    </style>
    <script type="module" src="./ab-page.js"></script>
  </head>
  <body>
    <main id="comparison">
      <h1>ASCII comparison</h1>
      <img id="source" alt="Original source">
      <div class="grids">
        <section class="side"><h2>Left</h2><pre id="left-grid" class="grid"></pre></section>
        <section class="side"><h2>Right</h2><pre id="right-grid" class="grid"></pre></section>
      </div>
    </main>
  </body>
</html>
